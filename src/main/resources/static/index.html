    toggleText.innerText = isLogin
        ? "Don't have an account? Sign up"
        : "Already have an account? Login";
}

async function login() {
    const res = await fetch(`${API_BASE}/login`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            email: email.value,
            password: password.value
        })
    });

    const data = await res.json();

    if (data.success) {
        localStorage.setItem("token", data.token);
        localStorage.setItem("email", email.value);
        updateUI();
    } else alert("Login failed");
}

async function signup() {
    const res = await fetch(`${API_BASE}/register`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            email: email.value,
            password: password.value
        })
    });

    if (res.ok) {
        alert("Signup success");
        toggleAuth();
    } else alert("Signup failed");
}

function logout() {
    localStorage.clear();
    location.reload();
}

function updateUI() {
    if (localStorage.getItem("token")) {
        authSection.classList.add("hidden");
        mainApp.classList.remove("hidden");
        userNav.classList.remove("hidden");
        displayEmail.innerText = localStorage.getItem("email");
    }
}

/* RISK SYSTEM */
function getRisk(score) {
    if (score <= 20) return { label:"VERY LOW", color:"text-green-400", bg:"bg-green-900/40 border-green-800" };
    if (score <= 40) return { label:"LOW", color:"text-green-500", bg:"bg-green-900/40 border-green-800" };
    if (score <= 60) return { label:"MEDIUM", color:"text-yellow-400", bg:"bg-yellow-900/40 border-yellow-800" };
    if (score <= 80) return { label:"HIGH", color:"text-red-400", bg:"bg-red-900/40 border-red-800" };
    return { label:"VERY HIGH", color:"text-red-600", bg:"bg-red-900/60 border-red-900" };
}

/* ANALYSIS */
async function startAnalysis() {

    const file = zipFile.files[0];
    if (!file) return alert("Select file");

    const formData = new FormData();
    formData.append("file", file);

    logBox.innerText = "> Running...\n> JPlag started...\n";

    tableBody.innerHTML = "";
    reportButtonContainer.innerHTML = "";

    try {
        const res = await fetch("/api/plagiarism/upload", {
            method:"POST",
            body:formData
        });

        const data = await res.json();

        logBox.innerText = data.detailedLogs?.join("\n") || "Done";

        if (data.jobId) {
            reportButtonContainer.innerHTML = `
                <button onclick="openReport('${data.jobId}')"
                class="bg-blue-600 hover:bg-blue-700 px-4 py-1.5 rounded-full text-xs font-semibold transition">
                View Interactive Report
                </button>`;
        }

        for (let [pair, score] of Object.entries(data.peerMatches || {})) {

            const risk = getRisk(score);

            tableBody.innerHTML += `
            <tr class="hover:bg-gray-800/40 transition">
                <td class="px-6 py-4">${pair}</td>
                <td class="px-6 py-4 font-bold ${risk.color}">
                    ${score.toFixed(2)}%
                </td>
                <td class="px-6 py-4 text-center">
                    <span class="px-3 py-1 text-xs rounded-full border ${risk.bg} ${risk.color}">
                        ${risk.label}
                    </span>
                </td>
            </tr>`;
        }

    } catch (e) {
        logBox.innerText += "\nERROR: " + e.message;
    }
}

/* REPORT */
async function openReport(jobId) {
    await fetch(`/api/plagiarism/view-report?jobId=${jobId}`);
    alert("Report opened on server");
}

window.onload = updateUI;

</script>
